name: build

on:
  workflow_call:
    inputs:
        codecs:
            required: true
            type: string
  workflow_dispatch:
    inputs:
        codecs:
            default: 'all'
            required: true
            type: string

jobs:
  build:
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y meson
          echo "/usr/lib/llvm-21/bin" >> $GITHUB_PATH

      - name: meson setup
        run: |
          meson setup --cross-file=./llvm.ini --prefix /usr -Dvideo-codecs=${{ inputs.codecs }} build

      - name: meson compile
        run: |
          meson compile -C build

      - name: install / tar
        run: |
          meson install --destdir ../dst/ -C build
          tar cJf avd-fw-${{ inputs.codecs }}.tar.xz -C dst/usr/lib/firmware apple

      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: avd-fw-${{ inputs.codecs }}.tar.xz
